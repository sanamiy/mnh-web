<style>
@font-face{font-family:Geist;src:url(./fonts/geist-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:Geist;src:url(./fonts/geist-500.woff) format("woff");font-weight:500 700;font-display:swap}

/* first-paint fallbacks only — the real values are written from DS (design system) at startup */
:root{color-scheme:dark;--bg:#090822;--text:#E8ECF7;--muted:#9AA0C6;--orchid:#F2A8EC;--periwinkle:#A9B4FF;--cyan:#9FE6F5;--mint:#A8F0D0;--ctaFill:#0E2A2A;--ctaFill2:#10183A;--font-jp:"Zen Kaku Gothic New";--fast:.25s;--aurora:linear-gradient(90deg,#F2A8EC,#A9B4FF,#9FE6F5,#A8F0D0)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,var(--font-jp),"Hiragino Sans",-apple-system,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#track{position:relative;z-index:1;pointer-events:none}
.hud{position:fixed;z-index:2;font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.24em;color:color-mix(in srgb,var(--text) 70%,transparent);pointer-events:none}
.hud.top{top:18px;left:20px;right:20px;display:flex;justify-content:space-between}
.hud.depth{left:20px;bottom:20px}
.hud.depth b{display:block;font-weight:400;font-size:22px;letter-spacing:.06em;color:var(--text);margin-top:4px}
.hud.sec{right:20px;bottom:20px;text-align:right}
.hud.sec .bar{width:2px;height:90px;background:rgba(255,255,255,.15);margin:0 0 10px auto;position:relative}
.hud.sec .bar i{position:absolute;left:0;top:0;width:2px;background:linear-gradient(var(--orchid),var(--periwinkle),var(--cyan),var(--mint));height:0}
@media (max-width:640px){.hud.top span:last-child{display:none}}
/* Buttons are real HTML links layered over the 3D scene: crisp at any size, keyboard- and screen-reader-friendly */
#ui{position:fixed;inset:0;z-index:2;pointer-events:none}
/* ---- instrument variant (?ui=instrument) ---- */
.ruler{display:none}
.im .ruler{display:block;position:fixed;left:18px;top:18%;height:64%;width:100px;overflow:hidden;z-index:2;pointer-events:none;
  -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.ruler-strip{position:absolute;left:8px;top:0;width:100%;will-change:transform}
.ruler-strip i{position:absolute;left:0;height:1px;background:color-mix(in srgb,var(--text) 22%,transparent)}
.ruler-mark{position:absolute;left:0;top:50%;width:0;height:0;border:3px solid transparent;border-left:5px solid var(--mint);transform:translateY(-50%)}
.ruler-val{position:absolute;left:30px;top:50%;transform:translateY(-50%);font:9px "Geist Mono",monospace;letter-spacing:.08em;color:var(--mint);opacity:.6}
.im .hud.depth{display:none}
.im .hud{font-family:"Geist Mono",monospace;letter-spacing:.14em}
.im .btn{border-radius:2px;letter-spacing:.04em;background:color-mix(in srgb,var(--ctaFill) 55%,transparent);border:1px solid color-mix(in srgb,var(--mint) 70%,transparent);box-shadow:none}
.im .btn:hover{background:color-mix(in srgb,var(--mint) 14%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--mint) 50%,transparent)}
.im .btn.aurora{background:color-mix(in srgb,var(--mint) 12%,transparent);border:1px solid var(--mint);box-shadow:none;color:var(--text)}
.im .btn.aurora:hover{background:color-mix(in srgb,var(--mint) 22%,transparent)}
.btn{position:absolute;font-family:Geist,var(--font-jp),"Hiragino Sans",sans-serif;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:.6em;box-sizing:border-box;white-space:nowrap;
  border-radius:999px;text-decoration:none;font-weight:600;letter-spacing:.04em;color:var(--mint);
  background:color-mix(in srgb,var(--ctaFill) 72%,transparent);border:1px solid color-mix(in srgb,var(--mint) 85%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--mint) 18%,transparent),inset 0 0 12px color-mix(in srgb,var(--mint) 8%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background var(--fast),box-shadow var(--fast),color var(--fast);will-change:transform,opacity}
.btn:hover{background:color-mix(in srgb,var(--mint) 16%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--mint) 35%,transparent),inset 0 0 14px color-mix(in srgb,var(--mint) 14%,transparent)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.btn .arrow{font-family:Geist,sans-serif;font-weight:400;transition:transform var(--fast)}
.btn:hover .arrow{transform:translateX(3px)}
.btn.aurora{color:var(--text);border:1px solid transparent;
  background:linear-gradient(color-mix(in srgb,var(--ctaFill2) 80%,transparent),color-mix(in srgb,var(--ctaFill2) 80%,transparent)) padding-box,var(--aurora) border-box;
  box-shadow:0 0 22px color-mix(in srgb,var(--periwinkle) 25%,transparent)}
.btn.aurora:hover{background:linear-gradient(color-mix(in srgb,var(--periwinkle) 22%,var(--ctaFill2)),color-mix(in srgb,var(--periwinkle) 22%,var(--ctaFill2))) padding-box,var(--aurora) border-box;box-shadow:0 0 32px color-mix(in srgb,var(--periwinkle) 45%,transparent)}
#loading{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:var(--bg);font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.3em;color:var(--muted);transition:opacity .8s}
#loading.done{opacity:0;pointer-events:none}
/* accessible mirror: hidden visually when WebGL runs, shown as a plain page otherwise */
.mirror{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mirror a:focus{position:fixed;left:16px;top:16px;z-index:9;clip:auto;width:auto;height:auto;background:#fff;color:#000;padding:8px 12px}
body.no-gl #gl,body.no-gl #track,body.no-gl .hud,body.no-gl #loading,body.no-gl .ruler,body.no-gl #ui{display:none}
body.no-gl .mirror{position:static;width:auto;height:auto;clip:auto;white-space:normal;max-width:720px;margin:auto;padding:48px 16px;line-height:1.8}

<script type="module">
import * as THREE from "three";
import { Reflector } from "three/addons/objects/Reflector.js";
import { gsap } from "gsap";
import { ScrollTrigger } from "gsap/ScrollTrigger";
import Lenis from "lenis";
import { Text, configureTextBuilder } from "troika-three-text";
// big glyph atlas up front so adding Japanese glyphs never resizes it mid-scroll (that caused text to blink)
configureTextBuilder({ textureWidth: 4096, sdfGlyphSize: 64 });
gsap.registerPlugin(ScrollTrigger);

// ---------------- design system ----------------
// One palette for the whole site. Brand "Aurora" = the logo gradient; use it only for hero type,
// key numbers and hero-panel borders (<=10% of the screen). Mint is the single action colour.
const DS = {
  bg:"#090822",
  text:"#E8ECF7", text2:"#C9CDE6", mist:"#9AA0C6", past:"#8A8FB8", white:"#FFFFFF",       // text (>=4.5:1 on glass)
  orchid:"#F2A8EC", periwinkle:"#A9B4FF", cyan:"#9FE6F5", mint:"#A8F0D0",                  // Aurora (logo gradient)
  orchidSoft:"#F7D9F4", orchidDeep:"#C77FD6",
  moonGold:"#F2C97A", moonLight:"#FFF4C8", moonPink:"#F7E3F0", lantern:"#FFB070",          // warm light (moon, lit windows)
  glass:"#0A1030", glassDeep:"#070B20", cell:"#0B1028", row:"#0A1530", cellPast:"#151A33",  // surfaces
  line:"#1C2346", linePast:"#5D6390", ctaFill:"#0E2A2A", ctaFill2:"#10183A",
  env:{ sky:"#07061C", surface:"#0C0A2A", twilight:"#2A1747", deep:"#18245A", abyss:"#082D48", trench:"#052A25" }, // depth haze
  // fonts: Smooch + Michroma only inside the logo; Geist for UI, Geist Mono for data, Zen Kaku Gothic New for Japanese
  font:{ script:"./fonts/Smooch-Regular.ttf", logo:"./fonts/Michroma-Regular.ttf", sans:"./fonts/geist-500.woff", light:"./fonts/geist-300.woff",
    mono:"./fonts/geist-mono-400.woff", jpFile:"./fonts/zen-kaku-gothic-new-500-subset.woff", jp:"Zen Kaku Gothic New" },
  // type scale in 3D units (1 unit = ~72px at the content plane on a 800px-tall screen)
  type:{ logo:3.3, display:1.5, h1:.8, h2:.5, title:.42, body:.3, label:.22, caption:.16 },
  typeNarrow:{ logo:2.5, display:1.05, h1:.6 },
  space:{ xs:.1, sm:.2, md:.4, lg:.6, xl:1 },
  radius:{ panel:.22, row:.18, cell:.1 },
  motion:{ fast:.25, base:.6, slow:1.1, ease:"power2.inOut", fadeIn:5, fadeOut:11 },
};
// expose colour tokens to CSS so HTML (HUD, buttons, fallback page) uses the same source
{ const r = document.documentElement.style, set = (k,v) => r.setProperty("--" + k, v);
  for (const k of ["bg","text","text2","mist","past","orchid","periwinkle","cyan","mint","moonGold","lantern","glass","ctaFill","ctaFill2"]) set(k, DS[k]);
  set("aurora", `linear-gradient(90deg,${DS.orchid},${DS.periwinkle},${DS.cyan},${DS.mint})`); set("muted", DS.mist); set("font-jp", `"${DS.font.jp}"`); set("fast", DS.motion.fast + "s"); }
const T = k => (NARROW && DS.typeNarrow[k]) || DS.type[k];
const TZ = "Asia/Tokyo", MICH = DS.font.logo, SMOOCH = DS.font.script;
// instrument style: chamfered hero frame with corner brackets, depth ruler, mono data
const IM = true; // the instrument style is the site style (the old ?ui toggle and the gradient variant were removed)
if (IM) document.documentElement.classList.add("im");
const BRAND = [DS.orchid, DS.periwinkle, DS.cyan, DS.mint];
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"], DOWJ = "日月火水木金土";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------- data ----------------
const ymd = d => new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const now = new Date(), today = ymd(now);
let data = {events:[]};
try { data = await (await fetch("./events.json",{cache:"no-cache"})).json(); } catch(e) {}
const events = data.events || [];
const endOf = e => new Date(e.ends_at || e.starts_at);
const hm = s => new Date(s).toLocaleTimeString("ja-JP",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
const dow = e => { const [y,m,d] = e.date.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); };
const md = e => e.date.slice(5).replace("-",".");
const next = events.find(e => endOf(e) > now) || null;
const past = events.filter(e => endOf(e) <= now).reverse().slice(0,5);
const byDate = Object.fromEntries(events.map(e => [e.date,e]));
const [TY,TM] = today.split("-").map(Number);
const months = [-1,0,1].map(i => ({ y: TY + Math.floor((TM-1+i)/12), m: ((TM-1+i)%12+12)%12 + 1 })); // last, this, next month

// mirror (screen readers / no-WebGL)
{
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
  const jp = e => `${Number(e.date.slice(5,7))}月${Number(e.date.slice(8))}日（${DOWJ[dow(e)]}）${hm(e.starts_at)}〜${e.ends_at?hm(e.ends_at):""}`;
  const li = e => `<li>${jp(e)}　${e.round?`#${e.round}　`:""}お題：${e.url?`<a href="${esc(e.url)}">${esc(e.theme)}</a>`:esc(e.theme)}</li>`;
  document.getElementById("m-next").innerHTML = next ? li(next).replace(/<\/?li>/g,"") : "日程は決まり次第お知らせします。";
  document.getElementById("m-cal").innerHTML = events.filter(e => months.some(({y,m}) => e.date.startsWith(`${y}-${String(m).padStart(2,"0")}`))).map(li).join("") || "<li>開催日は決まり次第お知らせします。</li>";
  document.getElementById("m-past").innerHTML = past.map(li).join("");
  if (data.discord_invite) document.getElementById("m-discord").href = data.discord_invite;
}

// ---------------- renderer ----------------
const canvas = document.getElementById("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:"high-performance"}); } catch(e) {}
if (!renderer) { document.body.classList.add("no-gl"); throw new Error("WebGL unavailable"); }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .1, 420);
const fog = new THREE.FogExp2(0x090822, .006); scene.fog = fog; scene.background = new THREE.Color(0x090822);
const SEABED = -175;

const hemi = new THREE.HemisphereLight(0x7f88ff, 0x0a0a18, .9); scene.add(hemi);
const fill = new THREE.DirectionalLight(0x8090d0, .9); fill.position.set(-20, 15, 60); scene.add(fill);
const moonLight = new THREE.DirectionalLight(0xcfd2ff, 1.6); moonLight.position.set(48, 58, -190); scene.add(moonLight);

// depth palette (brand gradient going down)
const STOPS = [
  {y: 30,  c: new THREE.Color(DS.env.sky), d: .0045},
  {y: .05, c: new THREE.Color(DS.env.surface), d: .006},
  {y: -.05,c: new THREE.Color(DS.env.twilight), d: .017},
  {y: -35, c: new THREE.Color(DS.env.deep), d: .019},
  {y: -90, c: new THREE.Color(DS.env.abyss), d: .021},
  {y: -170,c: new THREE.Color(DS.env.trench), d: .023},
];
function atmosphere(y) {
  let a = STOPS[0], b = STOPS[STOPS.length-1];
  for (let i = 0; i < STOPS.length-1; i++) if (y <= STOPS[i].y && y >= STOPS[i+1].y) { a = STOPS[i]; b = STOPS[i+1]; break; }
  if (y > STOPS[0].y) b = a;
  const t = a === b ? 0 : (a.y - y) / (a.y - b.y);
  fog.color.copy(a.c).lerp(b.c, t); fog.density = a.d + (b.d - a.d) * t;
  scene.background.copy(fog.color);
  const under = y < 0;
  hemi.intensity = under ? 1.1 + .9 * Math.exp(y/40) : 1.5; fill.intensity = under ? .5 + .6 * Math.exp(y/30) : .9;
  moonLight.intensity = under ? .25 + .9 * Math.exp(y/25) : 1.4;
}

// ---------------- helpers ----------------
const mk = (w,h) => Object.assign(document.createElement("canvas"), {width:w, height:h});
function canvasTex(c){ const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
function rand(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const R = rand(20261109);

// ---------------- sky: stars + moon ----------------
{
  const n = 900, p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ p[i*3]=(R()-.5)*500; p[i*3+1]=8+R()*160; p[i*3+2]=-40-R()*260; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xdfe3ff, size:.7, sizeAttenuation:true, fog:false, transparent:true, opacity:.85})));
  const c = mk(512,512), x = c.getContext("2d");
  const gr = x.createLinearGradient(100,60,380,460); gr.addColorStop(0,DS.moonLight); gr.addColorStop(.5,DS.moonPink); gr.addColorStop(1,DS.moonGold);
  x.fillStyle = gr; x.beginPath(); x.arc(256,256,170,0,7); x.fill();
  x.globalCompositeOperation = "destination-out"; x.beginPath(); x.arc(330,205,150,0,7); x.fill();
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(c), fog:false, toneMapped:false}));
  moon.position.set(48, 58, -190); moon.scale.set(30,30,1); scene.add(moon);
  const h = mk(256,256), hx = h.getContext("2d"), hg = hx.createRadialGradient(128,128,0,128,128,128);
  hg.addColorStop(0,"rgba(255,230,200,.35)"); hg.addColorStop(1,"rgba(255,230,200,0)"); hx.fillStyle = hg; hx.fillRect(0,0,256,256);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(h), fog:false, blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.position.copy(moon.position); halo.scale.set(110,110,1); scene.add(halo);
  // the moon is drawn only for the main camera (layer 2): the water reflects it via its own smooth specular "moon road" instead of a
  // mirrored sprite, which shimmered on and off as the ripples distorted it
  moon.layers.set(2); halo.layers.set(2); camera.layers.enable(2);
}

// ---------------- water surface ----------------
// Gerstner swell (geometry) + 3-octave scrolling detail normals + planar reflection (Reflector)
// + Schlick Fresnel + GGX "moon road" glitter + crest translucency. From below: Snell's window
// (refraction inside ~48.6deg, total internal reflection outside).
const waterNormalTex = (() => {
  const N = 256, data = new Uint8Array(N*N*4), r = rand(77), waves = [];
  for (let i=0;i<28;i++){ const f = 1 + Math.floor(r()*14), a = r()*Math.PI*2, fx = Math.round(Math.cos(a)*f), fy = Math.round(Math.sin(a)*f);
    if (!fx && !fy) continue; waves.push([fx, fy, 1/Math.hypot(fx,fy), r()*Math.PI*2]); }
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    let dx = 0, dy = 0;
    for (const [fx,fy,a,ph] of waves){ const c = Math.cos(2*Math.PI*(fx*x+fy*y)/N + ph)*a*2*Math.PI/N; dx += c*fx; dy += c*fy; }
    const s = 9, nx = -dx*s, ny = -dy*s, l = Math.hypot(nx, ny, 1), i = (y*N+x)*4;
    data[i] = (nx/l*.5+.5)*255; data[i+1] = (ny/l*.5+.5)*255; data[i+2] = (1/l*.5+.5)*255; data[i+3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = true; t.anisotropy = 8; t.needsUpdate = true; return t;
})();
const MOON_DIR = new THREE.Vector3(48, 58, -190).normalize();
const water = new Reflector(new THREE.PlaneGeometry(700, 700, 220, 220), {
  textureWidth: Math.round(innerWidth * Math.min(devicePixelRatio, 1.5) * .5), textureHeight: Math.round(innerHeight * Math.min(devicePixelRatio, 1.5) * .5),
  clipBias: .003,
  shader: {
    name: "MNHWater",
    uniforms: { color:{value:null}, tDiffuse:{value:null}, textureMatrix:{value:null}, uNormalTex:{value:null},
      uTime:{value:0}, uCam:{value:new THREE.Vector3()}, uMoon:{value:MOON_DIR.clone()}, uFogColor:{value:new THREE.Color()}, uFogDensity:{value:.006} },
    vertexShader: `uniform mat4 textureMatrix;uniform float uTime;uniform vec3 uCam;

  camera.lookAt(look.x*1.2, y + look.y*.6, -12);
  uiRig.position.set(0, -y, 0); // content at camera-local (0, secY - camY, -12): fixed framing, unaffected by sway
  atmosphere(y);
  { const u = water.material.uniforms; u.uTime.value = t; u.uFogDensity.value = fog.density; u.uFogColor.value.copy(fog.color); u.uCam.value.copy(camera.position); }
  const under = THREE.MathUtils.smoothstep(-y, 0, 3);
  snow.material.uniforms.uTime.value = t; snow.material.uniforms.uVis.value = under;
  rays.mat.uniforms.uTime.value = t; rays.mat.uniforms.uVis.value = under * THREE.MathUtils.smoothstep(y, -130, -50);
  for (const r of rays) r.rotation.z = Math.sin(t*.2 + r.userData.ph)*.18;
  kelpMat.uniforms.uTime.value = t; ruinUniforms.uTime.value = t; landmarks?.update(t, y);
  for (const b of blinkers) b.visible = Math.sin(t*2 + b.userData.blink) > -.2;
  core.children.forEach(c => { if (c.userData.spin) { c.rotation.y += .005*c.userData.spin*60/60; c.rotation.x += .003*c.userData.spin; } });
  fish.p.forEach((f,i) => { const a = t*f.s + f.ph; dummy.position.set(f.c.x + Math.cos(a)*f.r, f.c.y + Math.sin(t*.7+f.ph)*.6, f.c.z + Math.sin(a)*f.r*.6);
    dummy.rotation.set(0, -a + (f.s>0 ? -Math.PI/2 : Math.PI/2), 0); dummy.updateMatrix(); fish.im.setMatrixAt(i, dummy.matrix); });
  fish.im.instanceMatrix.needsUpdate = true;
  // section fade by distance to camera depth
  let nearest = sections[0], nd = 1e9;
  for (const s of sections){
    const d = Math.abs(y - s.userData.y), o = 1 - THREE.MathUtils.smoothstep(d, DS.motion.fadeIn, DS.motion.fadeOut);
    if (d < nd){ nd = d; nearest = s; }
    s.visible = o > .01; s.userData.o = o;
    if (s.visible) s.traverse(c => { if (c.isMesh && !c.material?.uniforms && c.text === undefined && c.userData.base !== undefined){ c.material.opacity = o * c.userData.base; } else if (c.isMesh && c.material?.uniforms?.uOpacity){ c.material.uniforms.uOpacity.value = o; c.material.uniforms.uTime.value = t; }
      else if (c.text !== undefined){ c.fillOpacity = o * (c.userData.base ?? 1); } });
  }
  depthEl.textContent = (y >= 0 ? "+" : "") + Math.round(y) + " m";
  if (IM){ const rh = rulerStrip.parentElement.clientHeight; rulerStrip.style.transform = `translateY(${rh/2 - (10 - y) * RPX}px)`; document.getElementById("rulerVal").textContent = (y >= 0 ? "+" : "-") + String(Math.abs(y).toFixed(1)).padStart(5, "0") + "m"; }
  progEl.style.height = (tl?.scrollTrigger ? tl.scrollTrigger.progress*100 : 0) + "%";
  renderer.render(scene, camera);
  placeButtons();
}
NARROW = innerWidth/innerHeight < .9;
buildUI(); buildTimeline();
gsap.ticker.add(frame);
setTimeout(textReady, 6000); // fallback if a font is slow
</script>
